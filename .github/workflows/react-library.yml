name: React library CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  react-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install library dependencies
        working-directory: packages/react
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: packages/react
        run: npm run typecheck
      - name: Build
        working-directory: packages/react
        run: npm run build

      - name: Verify package exports and tarball
        working-directory: packages/react
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/index.css
          npm pack --dry-run --json > /tmp/react-package.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/react-package.json'))[0]; for (const name of ['package/dist/index.js','package/dist/index.d.ts','package/dist/index.css']) { if (!p.files.some(f=>f.path===name)) throw new Error('Missing '+name); }"
